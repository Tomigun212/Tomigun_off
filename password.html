<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Page de mot de passe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f1f1;
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    input[type="password"] {
      padding: 10px;
      width: 100%;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 10px 20px;
      border: none;
      background-color: #4CAF50;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .error {
      color: red;
      margin-top: 10px;
    }

    .success {
      color: green;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Entrer le mot de passe</h2>
  <input type="password" id="password" placeholder="Mot de passe">
  <button onclick="checkPassword()">Valider</button>
  <div id="message"></div>
</div>

<script>
  const CORRECT_PASSWORD = "qwerty"; // à changer selon ton besoin

  function checkPassword() {
    const input = document.getElementById("password").value;
    const message = document.getElementById("message");

    if (input === CORRECT_PASSWORD) {
      message.innerHTML = "<p class='success'>Accès autorisé !</p>";
      // redirection possible :
      // window.location.href = "page-principale.html";
    } else {
      message.innerHTML = "<p class='error'>Mot de passe incorrect.</p>";
    }
  }
</script>

</body>
</html>
